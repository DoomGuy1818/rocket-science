syntax = "proto3";

package payment.v1;

import "google/api/annotations.proto";
import "validate/validate.proto";

option go_package = "github.com/DoomGuy1818/rocket-science/shared/pkg/proto/payment/v1;payment_v1";

service PaymentService {
  rpc PayOrder(PayOrderRequest) returns (PayOrderResponse) {
    option (google.api.http) = {
      post: "/api/v1/payOrders"
      body: "*"
    };
  };
}

// Перечисление способов оплаты деталей
enum PaymentMethod {
  PAYMENT_METHOD_UNKNOWN = 0;
  PAYMENT_METHOD_CARD = 1;
  PAYMENT_METHOD_SBP = 2;
  PAYMENT_METHOD_CREDIT_CARD = 3;
  PAYMENT_METHOD_INVESTOR_MONEY = 4;
}

// Запрос на оплату товаров
message PayOrderRequest {
  // uuid заказа
  string order_id = 1 [
    (validate.rules).string.uuid = true
  ];

  // uuid пользователя
  string user_uuid = 2 [
    (validate.rules).string.uuid = true
  ];

  //Способ оплаты деталей
  PaymentMethod payment_method = 3 [
    (validate.rules).enum.defined_only = true
  ];
}

// Ответ при оплате товара
message PayOrderResponse {

  // uuid прошедшей транзакции
  string transaction_uuid = 1 [
    (validate.rules).string.uuid = true
  ];
}