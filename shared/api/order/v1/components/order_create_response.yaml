type: object
required:
  - order_uuid
  - total_price
properties:
  order_uuid:
    type: string
    format: uuid
    description: ID заказа
    example: 01a0bdc6-6280-732f-8517-52c3480db444
  total_price:
    type: number
    format: float
    description: цена товаров в корзине
    example: 315.32
